version: 2
updates:
  # Keeps actions/checkout, actions/setup-node, etc. current so we don't
  # silently fall behind on Actions-runtime deprecations (e.g. Node 20 -> 24).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # npm dependency updates (security + maintenance). Group minor/patch to
  # avoid PR spam; major bumps still land individually for review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Next's lint stack is not ready for these majors yet:
    # - eslint 10: eslint-plugin-react (via eslint-config-next) only peers eslint ^9
    # - typescript 7: typescript-eslint requires typescript <6.1
    # Revisit when eslint-config-next / typescript-eslint advertise support.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
