version: 2
updates:
  # Keeps actions/checkout, actions/setup-node, etc. current so we don't
  # silently fall behind on Actions-runtime deprecations (e.g. Node 20 -> 24).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # npm dependency updates (security + maintenance). Group minor/patch to
  # avoid PR spam; major bumps still land individually for review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
