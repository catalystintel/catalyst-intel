name: Unblock Omer Vercel deploys

# When Vercel marks a git deployment BLOCKED (unverified author / seat) or
# ERROR for access / GitHub App / permission issues on commits by
# omer.nachshon, redeploy with the team VERCEL_TOKEN so `main` (production)
# and `dev` (staging preview) keep shipping.
#
# Fallback chain (see scripts/vercel-unblock-redeploy.mjs):
#   API same-sha redeploy → API latest-commit → API gitSource tip → CLI file upload
#
# Schedule only runs from the repo default branch (`main`). Keep this file on
# both `dev` and `main` so promote carries it; once on `main`, the cron is live.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Vercel CLI (CLI fallback deploy)
        run: npm install -g vercel@56

      - name: Heal blocked / access-failed Omer deploys
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_PROJECT_NAME: catalyst-intel
          VERCEL_UNBLOCK_ALLOW_CLI: "1"
        run: node scripts/vercel-unblock-redeploy.mjs
