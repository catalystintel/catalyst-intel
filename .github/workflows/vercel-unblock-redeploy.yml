name: Unblock Omer Vercel deploys

# CD heal for Omer / access-blocked Vercel deploys — NOT part of CI verify.
# Keep this out of ci.yml: it races Vercel's git integration (which may block
# before or after CI finishes), and must run even when CI deploy fails.
#
# On every push to `main`, wait 1 minute (so Vercel can create a Blocked
# deploy first), then heal leftover BLOCKED / access-failed Production deploys.
# Schedule remains a backup poller; workflow_dispatch is for manual runs.
#
# Fallback chain (see scripts/vercel-unblock-redeploy.mjs):
#   API same-sha redeploy → API latest-commit → API gitSource tip → CLI file upload
#
# Schedule only runs from the repo default branch (`main`). Keep this file on
# both `dev` and `main` so promote carries it.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Wait 1 minute after main push (let Vercel block first)
        if: github.event_name == 'push'
        run: |
          echo "main pushed. Waiting 60s for Vercel git deploy to land (or Block)…"
          sleep 60

      - name: Install Vercel CLI (CLI fallback deploy)
        run: npm install -g vercel@56

      - name: Heal blocked / access-failed Omer deploys
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_PROJECT_NAME: catalyst-intel
          VERCEL_UNBLOCK_ALLOW_CLI: "1"
        run: node scripts/vercel-unblock-redeploy.mjs
