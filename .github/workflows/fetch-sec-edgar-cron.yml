name: Fetch catalysts (scheduled ETL)

# GitHub Actions' scheduled workflows have a 5-minute floor and are
# best-effort (delays are common at peak load) - this is the closest free
# approximation to the product's "every 1-2 minutes" goal. See DEPLOYMENT.md
# for the trade-off, the observed real-world cadence, and alternatives
# (Vercel Pro cron, external pinger). The app itself also self-heals stale
# data on read (src/lib/jobs/ingestion-freshness.ts) as a backstop for when
# this scheduler drifts.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

jobs:
  fetch:
    strategy:
      fail-fast: false
      matrix:
        environment: [production, staging]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger multi-source ingestion (${{ matrix.environment }})
        env:
          APP_URL: ${{ matrix.environment == 'production' && secrets.PROD_APP_URL || secrets.STAGING_APP_URL }}
          CRON_SECRET: ${{ matrix.environment == 'production' && secrets.CRON_SECRET || secrets.STAGING_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "${{ matrix.environment }}: APP_URL and/or CRON_SECRET repo secrets are not set yet - see DEPLOYMENT.md."
            echo "This is expected until that environment's secrets are configured; skipping without failing the workflow."
            exit 0
          fi

          response=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "$APP_URL/api/admin/fetch/all" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json")

          echo "HTTP status: $response"
          cat response.json

          if [ "$response" -ge 300 ]; then
            echo "Fetch request failed."
            exit 1
          fi
