name: Fetch SEC EDGAR (production cron)

# GitHub Actions' scheduled workflows have a 5-minute floor and are
# best-effort (delays are common at peak load) - this is the closest free
# approximation to the product's "every 1-2 minutes" goal. See DEPLOYMENT.md
# for the trade-off and alternatives (Vercel Pro cron, external pinger).
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion endpoint
        run: |
          if [ -z "${{ secrets.PROD_APP_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "PROD_APP_URL and/or CRON_SECRET repo secrets are not set yet - see DEPLOYMENT.md."
            echo "This is expected until you've deployed to production; skipping without failing the workflow."
            exit 0
          fi

          response=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "${{ secrets.PROD_APP_URL }}/api/admin/fetch/sec-edgar" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")

          echo "HTTP status: $response"
          cat response.json

          if [ "$response" -ge 300 ]; then
            echo "Fetch request failed."
            exit 1
          fi
