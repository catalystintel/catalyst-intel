name: Deploy migration

# Explicit, visible-in-Actions migration step for each deploy, in addition to
# the migration Vercel's own build already runs (`npm run build` =
# `node scripts/migrate.mjs && next build` - see package.json + DEPLOYMENT.md).
# Running it here too means a schema change shows up as its own checked step
# in the Actions log for every push to `dev` (staging) / `main` (production),
# independent of Vercel's build output. Both are safe to run against the same
# DB - drizzle tracks applied migrations and skips ones already applied.
#
# NOTE: this job currently no-ops (skips with a `::warning::`) whenever the
# PROD_/STAGING_ LIBSQL_* repo secrets below are unset, so it is NOT actually
# a fallback until those secrets are configured - see DEPLOYMENT.md.
on:
  push:
    branches: [main, dev]
  workflow_dispatch: {} # allows manually re-running a migration from the Actions tab

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Apply pending migrations
        env:
          LIBSQL_URL: ${{ github.ref_name == 'main' && secrets.PROD_LIBSQL_URL || secrets.STAGING_LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ github.ref_name == 'main' && secrets.PROD_LIBSQL_AUTH_TOKEN || secrets.STAGING_LIBSQL_AUTH_TOKEN }}
        run: |
          if [ -z "$LIBSQL_URL" ] || [ -z "$LIBSQL_AUTH_TOKEN" ]; then
            echo "::warning::${{ github.ref_name }}: PROD_LIBSQL_URL/PROD_LIBSQL_AUTH_TOKEN or STAGING_LIBSQL_URL/STAGING_LIBSQL_AUTH_TOKEN repo secrets are not set - this run did NOT touch the real DB. See DEPLOYMENT.md. Vercel's build-time migration is the only thing actually migrating this environment until these secrets are configured."
            exit 0
          fi

          npm run db:migrate
