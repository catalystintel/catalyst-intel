name: CI

# CI/CD for the two branches that matter: `dev` (staging) and `main`
# (production) - see .cursor/rules/git-branching-workflow.mdc and
# DEPLOYMENT.md. PRs into `dev` also run the verify job so feature branches
# are checked (format, lint, unit tests, build/type-check - covering both the
# frontend pages and backend API routes/lib code, since this is a single
# Next.js app) before merging.
#
# After a green push to `dev`/`main`, the `deploy` job ships via Vercel CLI
# (team token) so commits are not stuck on Vercel git-author Blocked deploys.
# Omer/access-block heal is intentionally separate (vercel-unblock-redeploy.yml:
# push to main + 1m wait + 10-min cron) so a red CI deploy never skips the heal.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      # Placeholder values only - just enough for `next build` to not fail
      # on missing env vars. No real secrets are used or needed for CI.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SEC_EDGAR_USER_AGENT: catalyst-intel-ci ci@example.com
      DATABASE_URL: file:./local.db
    steps:
      # Pin to v7+: earlier majors run their own action code on the
      # (now-deprecated) Node 20 Actions runtime. This is unrelated to the
      # node-version below, which only controls the Node used to run our app.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Prettier format check
        run: npm run format:check

      - run: npm run lint

      - name: Unit tests (frontend + backend)
        run: npm test

      # `npm run build` = `node scripts/migrate.mjs && next build` (see package.json), so
      # this also verifies every committed migration applies cleanly against a throwaway
      # SQLite file before it ever reaches staging/production - see DEPLOYMENT.md.
      - name: Build (migrations + type-check for frontend + backend)
        run: npm run build

  deploy:
    needs: test-and-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Vercel CLI
        run: npm install -g vercel@56

      - name: Deploy to Vercel (CLI / team token)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Stable staging host for the `dev` branch (same as DEPLOYMENT.md /
          # unblock workflow). CLI previews do not auto-get the git-dev alias.
          STAGING_ALIAS: catalyst-intel-git-dev-zhbar10s-projects.vercel.app
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not set — skipping CI Vercel deploy. See DEPLOYMENT.md."
            exit 0
          fi
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::VERCEL_ORG_ID / VERCEL_PROJECT_ID not set — skipping CI Vercel deploy. See DEPLOYMENT.md."
            exit 0
          fi

          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "Deploying production from main…"
            vercel deploy --prod --yes --scope "$VERCEL_ORG_ID"
            exit 0
          fi

          echo "Deploying preview/staging from dev…"
          OUT=$(vercel deploy --yes --scope "$VERCEL_ORG_ID")
          echo "$OUT"
          DEPLOY_URL=$(printf '%s\n' "$OUT" | grep -oE 'https://[^[:space:]]+\.vercel\.app' | tail -n1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Could not parse Vercel deployment URL from CLI output"
            exit 1
          fi
          echo "Preview URL: $DEPLOY_URL"
          echo "Aliasing to staging: $STAGING_ALIAS"
          vercel alias set "$DEPLOY_URL" "$STAGING_ALIAS" --scope "$VERCEL_ORG_ID"
