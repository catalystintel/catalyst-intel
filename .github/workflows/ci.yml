name: CI

# CI/CD only runs for the two branches that matter: `dev` (staging) and
# `main` (production) - see .cursor/rules/git-branching-workflow.mdc and
# DEPLOYMENT.md. PRs into `dev` also run this so feature branches are
# checked (format, lint, unit tests, build/type-check - covering both the
# frontend pages and backend API routes/lib code, since this is a single
# Next.js app) before merging. This workflow only verifies the code - it does
# not deploy. Deployment on push to `dev`/`main` is handled separately by
# Vercel's own GitHub integration (see vercel.json and DEPLOYMENT.md).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      # Placeholder values only - just enough for `next build` to not fail
      # on missing env vars. No real secrets are used or needed for CI.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SEC_EDGAR_USER_AGENT: catalyst-intel-ci ci@example.com
      DATABASE_URL: file:./local.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Prettier format check
        run: npm run format:check

      - run: npm run lint

      - name: Unit tests (frontend + backend)
        run: npm test

      - name: Build (also type-checks frontend + backend)
        run: npm run build
